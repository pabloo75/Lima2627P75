<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UFT-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario en HTML 5</title>
</head>
<body>
  <h1>Formulario en HTML 5</h1>

  <form action="#" method="get">
    <ul>
      <li>
        <label for="nombre">Nome:</label>
        <input type="text" id="nombre" name="nombre" required autofocus >
      </li>
      <li>
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required >
      </li>
      <li>
        <label for="url">URL:</label>
        <input type="url" id="url" name="url" placeholder="Escribe a URL da túa web persoal" >
      </li>
      <li>
        <label for="fecha">Data:</label>
        <input type="date" id="fecha" name="fecha" >
      </li>
      <li>
        <label for="hora">Hora:</label>
        <input type="time" id="hora" name="hora" >
      </li>
      <li>
        <label for="edad">Idade:</label>
        <input type="number" id="edad" name="edad" min="18" max="65" >
      </li>
      <li>
        <label for="tel">Teléfono:</label>
        <input type="tel" id="tel" name="tel" >
      </li>
      <li>
        <label for="color">Cor favorita:</label>
        <input type="color" id="color" name="color" >
      </li>
      <li>
        <input type="submit" value="Enviar" >
      </li>
    </ul>
  </form>
</body>
</html>
