<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Cuadrícula de colores</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <table>
        <colgroup>
            <col width="80"><col width="80"><col width="80"><col width="80">
            <col width="80"><col width="80"><col width="80">
        </colgroup>
        <tbody>
            <tr><!-- 1 -->
                <td class="rojo" rowspan="3">1</td>
                <td class="rojo" rowspan="2"></td>
                <td class="rojo" colspan="2"></td>
                <td class="rojo" rowspan="3"></td>
                <td class="rojo" colspan="2"></td>
            </tr>
            <tr><!-- 2 -->
                <td class="naranja">2</td>
                <td class="naranja"></td>
                <td class="naranja"></td>
                <td class="naranja"></td>
            </tr>
            <tr><!-- 3 -->
                <td class="amarillo" colspan="2">3</td>
                <td class="amarillo"></td>
                <td class="amarillo"></td>
                <td class="amarillo" rowspan="3"></td>
            </tr>
            <tr><!-- 4 -->
                <td class="verde">4</td>
                <td class="verde" colspan="2"></td>
                <td class="verde" colspan="3"></td>
            </tr>
            <tr><!-- 5 -->
                <td class="cian">5</td>
                <td class="cian" colspan="2"></td>
                <td class="cian" rowspan="2"></td>
                <td class="cian" colspan="2"></td>
            </tr>
            <tr><!-- 6 -->
                <td class="azul">6</td>
                <td class="azul" colspan="2"></td>
                <td class="azul" colspan="3"></td>
            </tr>
            <tr><!-- 7 -->
                <td class="morado" rowspan="4">7</td>
                <td class="morado" colspan="2" rowspan="2"></td>
                <td class="morado"></td>
                <td class="morado" colspan="3"></td>
            </tr>
            <tr><!-- 8 -->
                <td class="rojo" rowspan="3">8</td>
                <td class="rojo" colspan="3" rowspan="3"></td>
            </tr>
            <tr><!-- 9 -->
                <td class="naranja">9</td>
                <td class="naranja"></td>
            </tr>
            <tr><!-- 10 -->
                <td class="amarillo">10</td>
                <td class="amarillo"></td>
            </tr>
            <tr><!-- 11 -->
                <td class="verde">11</td>
                <td class="verde" colspan="4"></td>
                <td class="verde"></td>
                <td class="verde" rowspan="2"></td>
            </tr>
            <tr><!-- 12 -->
                <td class="cian" colspan="3">12</td>
                <td class="cian"></td>
                <td class="cian" rowspan="2"></td>
                <td class="cian" rowspan="2"></td>
            </tr>
            <tr><!-- 13 -->
                <td class="azul" colspan="3" rowspan="5">13</td>
                <td class="azul"></td>
                <td class="azul"></td>
            </tr>
            <tr><!-- 14 -->
                <td class="morado">14</td>
                <td class="morado"></td>
                <td class="morado"></td>
                <td class="morado"></td>
            </tr>
            <tr><!-- 15 -->
                <td class="rojo">15</td>
                <td class="rojo"></td>
                <td class="rojo" colspan="2" rowspan="2"></td>
            </tr>
            <tr><!-- 16 -->
                <td class="naranja" rowspan="3">16</td>
                <td class="naranja" rowspan="3"></td>
            </tr>
            <tr><!-- 17 -->
                <td class="amarillo" colspan="2">17</td>
            </tr>
            <tr><!-- 18 -->
                <td class="verde">18</td>
                <td class="verde" colspan="2"></td>
                <td class="verde" colspan="2"></td>
            </tr>
            <tr><!-- 19 -->
                <td class="cian">19</td>
                <td class="cian" colspan="6"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
