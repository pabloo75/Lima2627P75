<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilizado de Formulario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="cont">
        <h1>Validación de formularios</h1>
    
        <form id="formulario" action="#" method = "get">
            <label for="nombre"></label>
            <input type="text" id="nombre" name="nombre" placeholder="nombre" required="required">

            <label for="email"></label>
            <input type="email" id="email" name="email" placeholder="email" required="required">

            <label for="apodo"></label>
            <input type="text" id="apodo" name="apodo" placeholder="apodo">

            <label for="grupo"></label>
            <input type="text" id="grupo" name="grupo" placeholder="grupo de musica">

        </form>
    </div>
</body>
</html>
